[project]
name = "archviz-controller"
version = "1.0.1"
description = "A ComfyUI custom node and workflow for architectural visualization with Krea 2 Turbo, featuring configurable presets for lighting, atmosphere, architectural style, composition, camera angles, and rendering detail. Designed to help create consistent, high-quality architectural images."
license = { text = "MIT License" }
requires-python = ">=3.10"
dependencies = []
classifiers = [
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
]

[project.urls]
Repository = "https://github.com/Timmy-ComfyUI/comfyui_archviz_controller"
"Bug Tracker" = "https://github.com/Timmy-ComfyUI/comfyui_archviz_controller/issues"

[tool.comfy]
PublisherId = "timmy-comfyui"
DisplayName = "ArchViz Presets & Controller"
